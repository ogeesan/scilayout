[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "scilayout"
dynamic = ["version"]
authors = [{ name = "George Stuyt" }]
description = "Create axes from top left of figure in centimetres to simplify scientific figure generation."
dependencies = [
    "matplotlib>=3.5",
    "numpy>=1.21.3",
    "pydantic>=2.14.4",
]
requires-python = ">=3.10"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
keywords = [
    "matplotlib",
    "figures",
    "layout",
    "publication",
    "scientific-papers",
    "thesis",
    "centimetres",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Matplotlib",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Artistic Software",
    "Topic :: Multimedia :: Graphics :: Presentation",
    "Topic :: Multimedia :: Graphics :: Editors :: Vector-Based",
    "Topic :: Scientific/Engineering :: Visualization",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/ogeesan/scilayout.git"
Issues = "https://github.com/ogeesan/scilayout/issues"
Changelog = "https://github.com/ogeesan/scilayout/blob/main/CHANGELOG.md"
Documentation = "https://ogeesan.github.io/scilayout/"
# homepage = 

[tool.setuptools.packages.find]
where = ["src"]
include = ["scilayout"]
exclude = ["tests*"]

[tool.setuptools.package-data]
scilayout = ["py.typed"]

[tool.setuptools.dynamic]
version = { attr = "scilayout.__version__" }

[tool.ruff.format]
# ruff can format python code blocks in Markdown, which rewrites the snippet includes
# (--8<-- "file.py") in the docs into the comparison "--8 < --"file.py""
exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # import sorting
    "UP",      # pyupgrade
    "B",       # bugbear
    "C4",      # comprehensions
    "SIM",     # simplifications
    "RUF",     # ruff-specific
    "NPY",     # numpy
    "D",       # docstrings
    "ANN",     # type annotations
]
ignore = [
    "D203",    # conflicts with D211
    "D213",    # conflicts with D212
    "ANN401",  # Any is acceptable for style values
    "E501",    # line length is left to the formatter; long docstring lines are ok
    "RUF013",  # implicit optional
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # re-exports
"tests/*" = [
    "D",    # docstring
    "ANN",  # type annotations
]

[tool.pytest.ini_options]
addopts = "--strict-markers"
markers = [
    "visual: writes figures (SVG and PNG) to look at; added automatically to any test that uses the output_dir fixture. Run them with `pytest -m visual --keep-outputs`.",
]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.10"
typeCheckingMode = "standard"

[dependency-groups]
dev = [
    "defusedxml>=0.7.1",
    "ipython>=8.12.3",
    "mkdocstrings[python]>=1.0.6",
    "pyqt5==5.15.11; sys_platform == 'win32'",          # windows compatibility
    "pyqt5-qt5==5.15.2; sys_platform == 'win32'",       # windows compatibility
    "pyright>=1.1.414",
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.17.6",
    "zensical>=0.0.52",
]
