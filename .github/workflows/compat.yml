name: Matplotlib Compatibility Tests

# Runs the tests against the oldest supported, several in-between and the newest matplotlib.
# `just compat` runs the same versions locally.
# The regular Tests workflow uses the versions pinned in uv.lock (except on Python 3.10).

on:
  schedule:
    - cron: "0 6 * * 6"
      timezone: "Australia/Melbourne"
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded runs on a pull request, but never runs on main or scheduled runs
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  compat:
    name: ${{ matrix.name }} (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: matplotlib 3.5.0
            python-version: "3.10"
            install: 'matplotlib==3.5.0 numpy==1.21.3'
          - name: matplotlib 3.5.3
            python-version: "3.10"
            install: 'matplotlib==3.5.3 "numpy<2"'
          - name: matplotlib 3.6.3
            python-version: "3.10"
            install: 'matplotlib==3.6.3 "numpy<2"'
          - name: matplotlib 3.7.5
            python-version: "3.10"
            install: 'matplotlib==3.7.5 "numpy<2"'
          - name: matplotlib 3.8.4
            python-version: "3.10"
            install: 'matplotlib==3.8.4 "numpy<2"'
          - name: matplotlib 3.9.4
            python-version: "3.10"
            install: 'matplotlib==3.9.4'
          - name: matplotlib 3.10.5
            python-version: "3.10"
            install: 'matplotlib==3.10.5'
          - name: matplotlib newest (with newest numpy)
            python-version: "3.13"
            install: '--upgrade matplotlib numpy'
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
      # uv.lock only covers Python 3.11+ (see [tool.uv] environments in pyproject.toml),
      # so install without it
      - run: |
          uv venv
          uv pip install -e . --group dev
      - name: Install ${{ matrix.name }}
        run: uv pip install ${{ matrix.install }}
      - run: uv pip list | grep -iE "^(matplotlib|numpy) "
      - run: uv run --no-sync pytest
