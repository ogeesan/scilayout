name: Compatibility Tests

# Runs the tests against the newest and the oldest supported matplotlib and numpy.
# The regular Tests workflow uses the versions pinned in uv.lock.

on:
  schedule:
    - cron: "0 20 * * 5"
      timezone: 'Australia/Melbourne'
  workflow_dispatch:
  pull_request:
    paths:
      - pyproject.toml
      - .github/workflows/compat.yml

permissions:
  contents: read

jobs:
  compat:
    name: ${{ matrix.name }} (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Newest matplotlib and numpy
            python-version: "3.13"
            install: --upgrade matplotlib numpy
          - name: Oldest supported matplotlib and numpy
            python-version: "3.10"
            install: matplotlib==3.5.0 numpy==1.21.3
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - name: Install ${{ matrix.name }}
        run: uv pip install ${{ matrix.install }}
      - run: uv pip list | grep -iE "^(matplotlib|numpy) "
      - run: uv run --no-sync pytest
